name: Indic OCR CI

on:
  workflow_dispatch:  # only runs when you manually click "Run workflow" in GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - name: Run preprocess unit tests
        run: python -m pytest tests/ -v --tb=short || echo "No tests found, skipping."

      - name: Run evaluate.py smoke test
        run: |
          python -c "
          from src.evaluate import compute_cer, compute_wer
          preds = ['नमस्ते', 'धन्यवाद']
          targets = ['नमस्ते', 'धन्यवाद']
          assert compute_cer(preds, targets) == 0.0, 'CER smoke test failed'
          assert compute_wer(preds, targets) == 0.0, 'WER smoke test failed'
          print('All smoke tests passed.')
          "

      - name: Check all source files importable
        run: |
          python -c "import src.preprocess; import src.augment; import src.evaluate; print('All imports OK')"
